[project]
name = "plus-ultra"
version = "0"
description = "Floating desktop assistant for TECHPERSON"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
plus-ultra = "plus_ultra.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", ".tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = [".tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
